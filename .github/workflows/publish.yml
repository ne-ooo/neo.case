name: Publish to LPM

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-lpm-${{ github.ref }}
  cancel-in-progress: false

env:
  LPM_VERSION: "0.74.1"
  LPM_INSTALLER_SHA256: "82776d71eac5201349617303a960b88f0f1d2d249fe07c758d3b1162e362434f"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24.11.0"

      - name: Install LPM
        env:
          LPM_INSTALL_VERSION: v${{ env.LPM_VERSION }}
        run: |
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/lpm-dev/rust-client/v${LPM_VERSION}/install.sh" --output "$RUNNER_TEMP/install-lpm.sh"
          echo "${LPM_INSTALLER_SHA256}  $RUNNER_TEMP/install-lpm.sh" | sha256sum --check --strict
          sh "$RUNNER_TEMP/install-lpm.sh"
          echo "$HOME/.lpm/bin" >> "$GITHUB_PATH"
          "$HOME/.lpm/bin/lpm" --version

      - name: Install locked dependencies
        run: >-
          lpm ci --strict-integrity --no-skills --no-editor-setup
          --no-security-summary

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package v${package_version}" >&2
            exit 1
          fi
          for skill in .lpm/skills/*.md; do
            if ! grep -Fqx "version: \"${package_version}\"" "${skill}"; then
              echo "${skill} version does not match package ${package_version}" >&2
              exit 1
            fi
          done

      - name: Verify release
        run: lpm run release:check

      - name: Validate publish contents
        run: lpm publish --check --yes

      - name: Publish with GitHub OIDC
        run: lpm publish --yes
