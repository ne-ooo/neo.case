name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LPM_VERSION: "0.74.1"
  LPM_INSTALLER_SHA256: "82776d71eac5201349617303a960b88f0f1d2d249fe07c758d3b1162e362434f"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']

    steps:
      - name: Check out the repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install LPM CLI
        env:
          LPM_INSTALL_VERSION: v${{ env.LPM_VERSION }}
        run: |
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/lpm-dev/rust-client/v${LPM_VERSION}/install.sh" --output "$RUNNER_TEMP/install-lpm.sh"
          echo "${LPM_INSTALLER_SHA256}  $RUNNER_TEMP/install-lpm.sh" | sha256sum --check --strict
          sh "$RUNNER_TEMP/install-lpm.sh"
          echo "$HOME/.lpm/bin" >> "$GITHUB_PATH"
          "$HOME/.lpm/bin/lpm" --version

      - name: Install dependencies for Node.js 18 compatibility
        if: matrix.node == '18'
        run: lpm ci --strict-integrity --no-engine-strict --no-skills --no-editor-setup --no-security-summary

      - name: Install dependencies from the lockfile
        if: matrix.node != '18'
        run: lpm ci --strict-integrity --no-skills --no-editor-setup --no-security-summary

      - name: Build and smoke-test the minimum runtime
        if: matrix.node == '18'
        run: lpm run build && node test/runtime-smoke.mjs

      - name: Run compatibility checks
        if: matrix.node == '20' || matrix.node == '22'
        run: lpm run check

      - name: Run the release check
        if: matrix.node == '24'
        run: lpm run release:check

      - name: Check the publish package
        if: matrix.node == '24'
        run: lpm publish --check --yes
